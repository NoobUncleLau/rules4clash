[custom]
; 从用户上传的 OpenClash 规则转换；适用于 subconverter 外部配置。
; 保留原 31 个策略组、选项顺序及规则优先级；原“直连”节点引用改为 DIRECT。
; 同源 .mrs 改为 clash-domain YAML；Telegram 保持原 classical 来源。
; GEOSITE cn/private 改为同源域名规则，GEOIP private/lan 合并为私网 CIDR。
; 自动测速间隔 300 秒；url-test 容差 100ms，fallback 参数保留 50ms。
; 原文件未指定测速 URL，补充 https://www.gstatic.com/generate_204。
; 台湾过滤仅修正“新北”被排除词“新”误排除；英文局部 (?i) 改为作用域写法。
; 规则有交叠时先匹配者生效；保留 Google/YouTube、Steam/SteamCN 等原顺序。

enable_rule_generator=true
overwrite_original_rules=true

